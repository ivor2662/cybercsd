<style>
:root{color-scheme:light;--bg:#f4f9ff;--panel:#fff;--text:#1f2d3d;--muted:#5f7186;--line:#d6e6f7;--brand:#1e7be0;--err:#d63a3a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);
  font:15px/1.6 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px 26px;box-shadow:0 10px 30px rgba(30,123,224,.12);display:flex;flex-direction:column;gap:14px}
.bar{height:6px;margin:-28px -26px 6px;border-radius:12px 12px 0 0;background:linear-gradient(90deg,#1e7be0,#29a3f0 60%,#3cc6d6)}
h1{margin:0;font-size:20px;color:var(--brand)}
p{margin:0;font-size:13px;color:var(--muted)}
label{font-size:13px;font-weight:700}
input{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px}
input:focus{outline:2px solid var(--brand);border-color:transparent}
button{padding:10px;font-size:15px;font-weight:700;border:none;border-radius:8px;background:var(--brand);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.2em;font-size:13px;color:var(--err)}
a{color:var(--brand);font-size:13px;text-decoration:none}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='csd_site_key_'+P.salt;
async function open(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
(async()=>{ // 同一分頁已登入過就直接開
  try{const k=sessionStorage.getItem(KEY); if(k){await open(b64(k));return}}catch(e){}
})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'),msg=document.getElementById('msg');
  btn.disabled=true;btn.textContent='解密中…';msg.textContent='';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveBits']);
    const raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(P.salt),iterations:P.iter},base,256));
    await open(raw);
    try{sessionStorage.setItem(KEY,btoa(String.fromCharCode(...raw)))}catch(e){}
  }catch(err){
    msg.textContent='密碼錯誤，請再試一次。';btn.disabled=false;btn.textContent='登入';
    document.getElementById('pw').select();
  }
});
</script>
